name: Deploy to Hostinger (Laravel + React)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup SSH
        shell: bash
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.PORT }}" -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      - name: Upload project to server
        shell: bash
        run: |
          set -e
          rsync -az --delete \
            --filter='P .env' \
            --filter='P storage/***' \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            --exclude "vendor/" \
            -e "ssh -p ${{ secrets.PORT }}" \
            ./ "${{ secrets.USER }}@${{ secrets.HOST }}:${{ secrets.APP_DIR }}/"

      - name: Composer + Artisan server
        shell: bash
        run: |
          ssh -p "${{ secrets.PORT }}" "${{ secrets.USER }}@${{ secrets.HOST }}" << 'EOF'
            set -euo pipefail
            cd "${{ secrets.APP_DIR }}"

            test -f .env
            ls -la .env

            PHP="${{ secrets.PHP_BIN }}"
            "$PHP" -v

            "$PHP" "$(command -v composer)" install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader

            # recreate storage symlink safely
            if [ -L public/storage ]; then
              rm public/storage
            elif [ -e public/storage ]; then
              echo "public/storage exists but is not a symlink. Skipping delete."
            fi

            if [ ! -e public/storage ]; then
              ln -s "${{ secrets.APP_DIR }}/storage/app/public" "${{ secrets.APP_DIR }}/public/storage"
            fi

            "$PHP" artisan migrate:fresh --seed --force

            "$PHP" artisan config:clear || true
            "$PHP" artisan route:clear || true
            "$PHP" artisan view:clear || true
            "$PHP" artisan cache:clear || true

            "$PHP" artisan config:cache || true
            "$PHP" artisan route:cache || true
            "$PHP" artisan view:cache || true

            "$PHP" artisan queue:restart || true
          EOF
