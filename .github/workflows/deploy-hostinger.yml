name: Deploy to Hostinger

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, bcmath, intl, gd, zip, fileinfo
          tools: composer:v2

      - name: Check PHP Extensions
        run: |
          php -v
          php -m | grep -i pdo
          php -m | grep -i mysql

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build React/Inertia assets
        run: npm run build

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy files to Hostinger
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_PORT }}" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude=".env" \
            --exclude="hostinger_deploy_key" \
            --exclude="hostinger_deploy_key.pub" \
            --exclude="storage/logs" \
            --exclude="storage/framework/cache" \
            --exclude="storage/framework/sessions" \
            --exclude="storage/framework/views" \
            --exclude="public/storage" \
            ./ ${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_PATH }}

      - name: Run Laravel commands on Hostinger
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_PORT }} ${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }} "
            cd ${{ secrets.HOSTINGER_PATH }} &&

            PHP_BIN=/opt/alt/php83/usr/bin/php &&

            \$PHP_BIN -v &&

            mkdir -p storage/framework/cache/data &&
            mkdir -p storage/framework/sessions &&
            mkdir -p storage/framework/views &&
            mkdir -p storage/logs &&
            mkdir -p bootstrap/cache &&

            chmod -R 775 storage bootstrap/cache &&

            \$PHP_BIN artisan optimize:clear &&
            \$PHP_BIN artisan migrate --force &&
            \$PHP_BIN artisan storage:link &&
            \$PHP_BIN artisan config:cache &&
            \$PHP_BIN artisan route:cache &&
            \$PHP_BIN artisan view:cache
          "
